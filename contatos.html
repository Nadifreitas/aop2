  <div class="contact-box">
    <form onsubmit="event.preventDefault(); alert('Mensagem demonstrativa! Para receber mensagens de verdade, é necessário conectar este formulário a um serviço.');">
      <label for="nome">Nome</label><input id="nome" name="nome" type="text" placeholder="Seu nome" required>
      <label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required>
      <label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem..." required></textarea>
      <button type="submit">Enviar mensagem</button>
    </form>
  </div>
